<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무 일정">
<meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>업무 일정</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --page:#f6f6f9;--surface:#fff;
  --ink:#14161c;--ink-2:#7c8090;--ink-3:#b8bcc8;
  --line:#e6e7ee;--hair:#eeeff4;
  --red:#e0382c;--sat:#2f6ad0;--amber:#e08a1e;--teal:#0d7f83;--indigo:#3b4fb0;--moss:#3f8b52;
  --field:#eeeff4;--chip:#e9eaf1;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 18px rgba(20,22,28,.05);
  --numsz:30px;--numfs:15px;
}
@media (max-width:660px){:root{--numsz:clamp(25px,7.6vw,34px);--numfs:clamp(13px,3.9vw,16px)}}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0a0b0e;--surface:#15171c;--ink:#f2f3f7;--ink-2:#8b90a0;--ink-3:#4a4f5c;
    --line:#262a33;--hair:#1f232b;--red:#ff5c4d;--sat:#6b9bf0;--amber:#f0a83c;--teal:#3fb3b6;
    --indigo:#7d8de0;--moss:#5cb974;--field:#22262e;--chip:#252932;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
 font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
 height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.view{display:none;flex:1;min-height:0;width:100%;max-width:1500px;margin:0 auto;
 padding:0 12px 8px;flex-direction:row;gap:9px}
.view.on{display:flex}
#v-year.on{display:block;overflow-y:auto;padding-bottom:12px;max-width:1500px}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.cal-pane{flex:6;padding:4px 6px 6px}
.list-pane{flex:2.6}
.memo-pane{flex:4;padding:11px 14px 12px}
/* 좁은 화면(휴대폰)에서는 위아래로 쌓기 */
@media (max-width:660px){
  .navbar{max-width:620px;padding:10px 16px 8px}
  .hsec-list{display:none}
  .hsec-cal{flex:1}
  .hsec-memo{flex:none}
  .hsec-memo .ptitle{display:none}
  .memo-label .mlab{display:inline}
  .view{flex-direction:column;max-width:620px;gap:8px}
  .cal-pane{flex:6}.list-pane{flex:2.6}.memo-pane{flex:4}
}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

header{flex:none;position:relative;z-index:25;background:color-mix(in srgb,var(--page) 82%,transparent);
 backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
 padding-top:env(safe-area-inset-top,0px)}
.navbar{display:flex;align-items:center;gap:9px;padding:9px 12px 7px;max-width:1500px;margin:0 auto}
.hsec{display:flex;align-items:center;gap:7px;min-width:0}
.hsec-cal{flex:6;padding-left:4px}
.hsec-list{flex:2.6}
.hsec-memo{flex:4}
.mo-btn,.yr-btn{font-size:26px;font-weight:680;letter-spacing:-.035em;line-height:1.1;flex:none}
.yr-btn{color:var(--ink-2);display:flex;align-items:baseline;gap:3px}
.yr-btn .cv{font-size:12px;color:var(--ink-3)}
.mo-btn:active,.yr-btn:active{opacity:.55}
.ptitle{font-size:15px;font-weight:680;letter-spacing:-.02em;color:var(--ink-2);white-space:nowrap}
.hspace{flex:1;min-width:0}
/* 창 확대 */
body[data-zoom="cal"] .list-pane,body[data-zoom="cal"] .memo-pane,
body[data-zoom="list"] .cal-pane,body[data-zoom="list"] .memo-pane,
body[data-zoom="memo"] .cal-pane,body[data-zoom="memo"] .list-pane{display:none}
body[data-zoom="cal"] .cal-pane,
body[data-zoom="list"] .list-pane,
body[data-zoom="memo"] .memo-pane{flex:1}
body.zoomed .hsec-list{display:none}
body.zoomed .hsec-memo .ptitle{display:none}
body.zoomed .hsec-cal{flex:1}
body.zoomed .hsec-memo{flex:none}
body.zoomed .memo-label .mlab{display:inline;font-size:15px;font-weight:680;color:var(--ink-2);letter-spacing:-.02em}
body[data-zoom="list"] .hsec-cal .zlab::after{content:"일정 목록"}
body[data-zoom="memo"] .hsec-cal .zlab::after{content:"메모"}
.zlab{display:none;font-size:15px;font-weight:680;color:var(--ink-2);letter-spacing:-.02em;margin-left:4px}
body[data-zoom="list"] .zlab,body[data-zoom="memo"] .zlab{display:inline}
#zoomOut{display:none}
body.zoomed #zoomOut{display:grid}
body[data-zoom="memo"] textarea.memo{font-size:16px;line-height:1.7;padding:16px 18px}
.yrlist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.yrlist button{background:var(--field);border-radius:10px;padding:9px 0;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.yrlist button.on{background:var(--ink);color:var(--surface)}
.catbtn{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);
 border:1px solid var(--line);border-radius:19px;padding:7px 12px 7px 10px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.catbtn i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--ink-3));display:inline-block}
.catmenu{display:flex;flex-direction:column;gap:2px}
.catmenu button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;font-size:14.5px;text-align:left;width:100%}
.catmenu button:hover{background:var(--field)}
.catmenu button.on{background:var(--field);font-weight:650}
.catmenu i{width:11px;height:11px;border-radius:4px;flex:none}
.cattag{font-size:11px;font-weight:700;color:var(--c);line-height:1;
 padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,transparent)}
.cattag:active{opacity:.6}
.edit-in{width:100%;background:var(--field);border:0;border-radius:9px;
 padding:7px 10px;font-size:15.5px;line-height:1.35}
.edit-in:focus{outline:2px solid var(--indigo);outline-offset:-1px}
.edit-tip{font-size:11px;color:var(--ink-2);margin-top:5px}
.crow{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--hair)}
.crow input[type=text]{flex:1;min-width:0;background:var(--field);border:0;border-radius:9px;padding:8px 11px;font-size:15px}
.crow input[type=color]{width:40px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.crow .mv{color:var(--ink-3);font-size:16px;padding:4px 5px}
.frow{display:flex;padding:8px 16px}
.frow input{flex:1;min-width:0;background:var(--field);border:0;border-radius:10px;padding:11px 13px;font-size:15px}
.frow input:focus{outline:2px solid var(--indigo);outline-offset:-1px}
.go2{flex:1;background:var(--ink);color:var(--surface);border-radius:11px;padding:11px;font-size:15px;font-weight:650}
.go2.sec{background:var(--field);color:var(--ink)}
.lnk{font-size:12.5px;color:var(--ink-3)}
.pop.left{left:12px;right:auto;transform-origin:top left}
.hbtn{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
 background:var(--surface);box-shadow:var(--shadow);font-size:21px;line-height:1;color:var(--ink-2);
 transition:transform .1s,color .12s}
.hbtn:hover{color:var(--ink)}
.hbtn:active{transform:scale(.93)}
.hbtn.txt{width:auto;padding:0 14px;font-size:14.5px;font-weight:600;color:var(--ink)}
.arrows{display:flex;gap:1px}
.arrow{width:29px;height:32px;display:grid;place-items:center;color:var(--ink-2);font-size:18px;border-radius:9px}
.arrow:active{background:var(--chip)}

.weekdays{flex:none;display:grid;grid-template-columns:repeat(7,1fr);padding:5px 4px 3px}
.weekdays span{text-align:center;font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.weekdays span:first-child{color:var(--red)}
.weekdays span:last-child{color:var(--sat)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr)}
.cell{position:relative;min-height:0;display:flex;flex-direction:column;align-items:stretch;
 justify-content:flex-start;gap:2px;padding:3px 3px 2px;overflow:hidden}
.cell>.num{align-self:center;flex:none}
.evs{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.ev{display:flex;align-items:center;gap:3px;font-size:9.5px;line-height:1.45;
 padding:1px 4px 1px 3px;border-radius:3px;overflow:hidden;flex:none;
 background:color-mix(in srgb,var(--c) 14%,transparent);border-left:2px solid var(--c)}
.ev .evn{flex:none;font-size:8.5px;font-weight:700;color:var(--c);opacity:.7}
.ev .evt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 color:var(--c);font-weight:600;text-align:left}
.ev.dl{background:var(--red);border-left-color:var(--red)}
.ev.dl .evt,.ev.dl .evn{color:#fff;opacity:1}
.ev.done{opacity:.42}
.ev.done .evt{text-decoration:line-through;font-weight:500}
.ev.pri .evt{font-weight:800}
.ev.more{background:none;border-left-color:transparent;padding-left:5px}
.ev.more .evt{color:var(--ink-3);font-weight:700}
.cell.dim .ev{opacity:.38}
@media (max-width:660px){
  .ev{font-size:0;height:4px;padding:0;border-radius:2px;border-left:0;
    background:var(--c);gap:0}
  .ev .evn,.ev .evt{display:none}
  .ev.more{display:none}
  .cell{padding:2px}
}
.num{width:var(--numsz);height:calc(var(--numsz) - 3px);border-radius:8px;display:grid;place-items:center;
 font-size:var(--numfs);font-weight:450;letter-spacing:-.02em;transition:background .13s,color .13s}
.cell.dim .num{color:var(--ink-3)}
.cell.sun .num,.cell.hol .num{color:var(--red)}
.cell.sat .num{color:var(--sat)}
.cell.sun.dim .num,.cell.hol.dim .num{color:color-mix(in srgb,var(--red) 35%,transparent)}
.cell.sat.dim .num{color:color-mix(in srgb,var(--sat) 35%,transparent)}
.holname{font-size:9px;font-weight:700;color:var(--red);line-height:1.1;margin-top:-2px;
 max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:none}
.cell.dim .holname{opacity:.4}
@media (max-width:660px){.holname{display:none}}
.yd.sat{color:var(--sat)}
.yd.hol{color:var(--red);font-weight:700}
.ywd i:first-child{color:var(--red)}
.ywd i:last-child{color:var(--sat)}
.hol-tag{font-size:12px;font-weight:700;color:var(--red);margin-left:7px}
.cell.today .num{color:var(--red);font-weight:700}
.cell.sel .num{background:var(--ink);color:var(--surface);font-weight:600}
.cell.sel.today .num{background:var(--red);color:#fff}
.cell.has .num{background:color-mix(in srgb,var(--indigo) 11%,transparent);font-weight:620}
.cell.hasdl .num{background:color-mix(in srgb,var(--red) 13%,transparent);font-weight:620}
.cell.today.has .num,.cell.today.hasdl .num{background:color-mix(in srgb,var(--red) 14%,transparent)}
.cell.sel .num,.cell.sel.has .num,.cell.sel.hasdl .num{background:var(--ink);color:var(--surface)}
.cell.sel.today .num{background:var(--red);color:#fff}
.ctip{position:fixed;z-index:85;background:var(--ink);color:var(--page);border-radius:11px;
  padding:9px 12px;font-size:12px;line-height:1.55;max-width:250px;
  box-shadow:0 8px 26px rgba(0,0,0,.24);opacity:0;pointer-events:none;
  transform:translateY(-4px);transition:opacity .13s ease,transform .13s ease}
.ctip.on{opacity:1;transform:none}
.ctip b{display:block;font-size:10.5px;font-weight:700;opacity:.6;margin-bottom:4px;letter-spacing:.03em}
.ctip .r{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctip .r.dl{color:#ff9d93;font-weight:600}
.ctip .r.dn{opacity:.5;text-decoration:line-through}
.ctip .r.mo{opacity:.6}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);padding:2px 2px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync i.on{background:var(--moss)}
.sync i.busy{background:var(--amber)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair)}
.setrow:last-child{border-bottom:0}
.setrow label{font-size:13.5px}
.setrow select{background:var(--field);border:0;border-radius:9px;padding:7px 9px;font-size:14px}
.setrow button{font-size:13px;font-weight:600;color:var(--indigo)}
.pop .note-s{font-size:11.5px;color:var(--ink-2);line-height:1.6;padding:9px 2px 2px}
.memoflag{position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--indigo);opacity:.85}

.year-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
@media(min-width:520px){.year-wrap{grid-template-columns:repeat(4,1fr)}}
.ymon{background:var(--surface);border-radius:13px;padding:8px 6px 9px;box-shadow:var(--shadow)}
.ymon h4{margin:0 0 5px 4px;font-size:14px;font-weight:680;letter-spacing:-.02em}
.ymon.cur h4{color:var(--red)}
.ywd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.ywd i{font-size:8px;font-style:normal;text-align:center;color:var(--ink-3)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr)}
.yd{aspect-ratio:1;display:grid;place-items:center;font-size:9.5px;border-radius:50%;line-height:1}
.yd.o{color:transparent}
.yd.hit{font-weight:700;color:var(--indigo)}
.yd.mk{background:var(--indigo);color:#fff;font-weight:700}
.yd.mk2{background:var(--moss);color:#fff;font-weight:700}
.yd.tod{background:var(--red);color:#fff;font-weight:700}

.day-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;
 padding:11px 13px 9px;border-bottom:1px solid var(--hair)}
.day-head h2{margin:0;font-size:16.5px;font-weight:680;letter-spacing:-.03em}
.day-head .wd{font-size:13px;color:var(--ink-2);font-weight:500;margin-left:5px}
.day-head .cnt{font-size:12.5px;color:var(--ink-2)}
.list{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{position:relative;display:grid;grid-template-columns:23px minmax(0,1fr) auto;gap:0 9px;
 padding:10px 12px 10px 13px;border-bottom:1px solid var(--hair)}
.item:last-child{border-bottom:0}
.item::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:0 2px 2px 0;background:transparent}
.item.pri::before{background:var(--amber)}
.item.dl::before{background:var(--red)}
.check{grid-column:1;align-self:start;margin-top:2px;width:21px;height:21px;border-radius:7px;border:1.7px solid var(--ink-3);display:grid;place-items:center}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.item.done .check{background:var(--moss);border-color:var(--moss)}
.item.done .check svg{opacity:1}
.check.locked{border-color:var(--red);border-style:dashed}
.body{grid-column:2;min-width:0}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:3px;line-height:1}
.no{font-size:10.5px;font-weight:700;color:var(--surface);background:var(--ink-3);min-width:16px;height:16px;padding:0 4px;border-radius:5px;display:grid;place-items:center}
.item.pri .no{background:var(--amber)}.item.dl .no{background:var(--red)}
.mdate{font-size:11.5px;color:var(--ink-2)}
.mtime{font-size:11.5px;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface));padding:2px 6px;border-radius:5px}
.item.done .mtime{color:var(--ink-2);background:var(--chip)}
.mtag{font-size:10.5px;color:var(--red);font-weight:700}
.mtag.pri{color:var(--amber)}
.title{font-size:16px;word-break:break-word;line-height:1.38;letter-spacing:-.015em}
.item.pri .title{font-weight:620}
.item.done .title{color:var(--ink-2);text-decoration:line-through}
.caret{font-size:10px;color:var(--ink-3);margin-left:5px;vertical-align:2px}
.acts{grid-column:3;display:flex;flex-direction:column;align-items:center;gap:0}
.acts button{width:27px;height:25px;display:grid;place-items:center;font-size:13px;color:var(--ink-3);border-radius:7px}
.acts .flag.on{color:var(--amber)}
.acts .note-btn.has{color:var(--indigo)}
.note{grid-column:2;overflow:hidden;max-height:0;opacity:0;margin-top:0;transition:max-height .22s,opacity .18s,margin .22s}
.note-inner{font-size:13.5px;line-height:1.6;color:var(--ink-2);border-left:2px solid var(--line);padding:1px 0 1px 10px;white-space:pre-wrap;word-break:break-word}
@media (hover:hover) and (pointer:fine){.item:hover .note.has{max-height:340px;opacity:1;margin-top:8px}}
.item.open .note.has,.item.open .note.edit{max-height:340px;opacity:1;margin-top:8px}
.note textarea{width:100%;min-height:66px;resize:vertical;background:var(--field);border:0;border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.5}
.empty{padding:20px 16px;color:var(--ink-2);font-size:14.5px}
.memo-label{flex:none;display:flex;align-items:baseline;justify-content:flex-end;
 font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;margin-bottom:7px}
.memo-label .mlab{display:none;margin-right:auto}
textarea.memo{flex:1;min-height:0;width:100%;resize:none;background:var(--field);border:0;border-radius:12px;
 padding:11px 13px;font-size:15px;line-height:1.55}
.saved{font-size:11px;color:var(--ink-2);font-weight:500;letter-spacing:0;opacity:0;transition:opacity .2s}
.saved.on{opacity:1}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:60;background:var(--page);transform:translateY(100%);
 transition:transform .32s cubic-bezier(.32,.72,0,1);overflow-y:auto;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:translateY(0)}
.sheet-bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--page) 88%,transparent);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;
 justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--hair)}
.sheet-bar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}
.sheet-bar button{color:var(--indigo);font-size:15px;font-weight:600}
.sheet-body{max-width:620px;margin:0 auto;padding:0 12px 20px}

.searchbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.searchbar input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
 border-radius:12px;padding:11px 14px;font-size:16px;box-shadow:var(--shadow)}
.searchbar input:focus{outline:0;border-color:var(--indigo)}
.searchbar button{flex:none;background:var(--ink);color:var(--surface);border-radius:11px;padding:11px 15px;font-size:14px;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--ink-2)}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:7px 0;font-size:13.5px;font-weight:600;color:var(--ink-2);border-radius:9px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

 border-top:1px solid var(--hair);padding:8px 12px calc(7px + env(safe-area-inset-bottom,0px))}

.pop-title{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;margin:2px 2px 9px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const addDays=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d);};

function caseState(c){
  const st=store.stages,idx=st.findIndex(s=>!c.done[s.id]);
  if(idx===-1)return{complete:true,idx:st.length};
  const stage=st[idx];
  if(idx===0)return{complete:false,idx,stage,deadline:null};
  const deadline=addDays(c.done[st[idx-1].id],stage.days),left=diffDays(deadline,TODAY);
  return{complete:false,idx,stage,deadline,left,level:left<0?'over':left<=2?'soon':'ok'};
}
const deadlinesOn=day=>{const o=[];store.cases.forEach(c=>{const s=caseState(c);
  if(!s.complete&&s.deadline===day)o.push({label:c.label,stage:s.stage.name,level:s.level});});return o;};
const ordItems=day=>store.items.filter(i=>i.date===day).sort((a,b)=>
  (a.done-b.done)||((b.pri?1:0)-(a.pri?1:0))||((a.time||'99:99')<(b.time||'99:99')?-1:1)||(a.id<b.id?-1:1));
const hasAny=day=>ordItems(day).length>0||deadlinesOn(day).length>0||!!(store.memos[day]||'').trim();

function parseInput(raw,baseYmd){
  let s=' '+raw.trim()+' ',d=fromYmd(baseYmd),hit=false,time=null,pri=false;
  if(/!|중요/.test(s)){pri=true;s=s.replace(/!/g,' ').replace(/중요/g,' ');}
  let cat=null;
  const tag=s.match(/#(\S+)/);
  if(tag){const f=store.cats.find(c=>c.name.replace(/\s/g,'').startsWith(tag[1].replace(/\s/g,'')));
    if(f){cat=f.id;s=s.replace(tag[0],' ');}}
  const m1=s.match(/\s(\d{1,2})\s*[\/월]\s*(\d{1,2})\s*일?/);
  if(m1){const y=today.getFullYear();let c=new Date(y,+m1[1]-1,+m1[2]);
    if(c<today&&(today-c)>15552000000)c=new Date(y+1,+m1[1]-1,+m1[2]);d=c;hit=true;s=s.replace(m1[0],' ');}
  if(!hit)for(const[w,off]of[['그저께',-2],['어제',-1],['오늘',0],['내일',1],['낼',1],['모레',2],['글피',3]]){
    if(s.includes(w)){d=new Date(today);d.setDate(d.getDate()+off);hit=true;s=s.replace(w,' ');break;}}
  if(!hit){const wd=s.match(/(다음\s*주|담주|차주|이번\s*주|금주)?\s*([일월화수목금토])요일/);
    if(wd){const t=WD.indexOf(wd[2]),b=new Date(today);
      if(wd[1]&&!/이번|금주/.test(wd[1]))b.setDate(b.getDate()+(7-b.getDay())+t);
      else{let df=(t-b.getDay()+7)%7;if(df===0)df=7;b.setDate(b.getDate()+df);}
      d=b;hit=true;s=s.replace(wd[0],' ');}}
  if(!hit){const dd=s.match(/\s(\d{1,2})일\s/);
    if(dd){let c=new Date(today.getFullYear(),today.getMonth(),+dd[1]);
      if(c<today)c=new Date(today.getFullYear(),today.getMonth()+1,+dd[1]);d=c;hit=true;s=s.replace(dd[0],' ');}}
  const tm=s.match(/(오전|오후|아침|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::|시)\s*(\d{1,2})?\s*분?/);
  if(tm){let h=+tm[2],mi=tm[3]?+tm[3]:0;const mer=tm[1]||'';
    if(/오후|저녁|밤/.test(mer)&&h<12)h+=12;
    if(/오전|아침|새벽/.test(mer)&&h===12)h=0;
    if(h<24&&mi<60){time=`${pad(h)}:${pad(mi)}`;s=s.replace(tm[0],' ');}}
  return{date:ymd(d),time,pri,cat,title:s.replace(/\s+/g,' ').trim()||raw.trim()};
}

function renderMonth(){
  const y=view.getFullYear(),m=view.getMonth();
  $('mTitle').textContent=(m+1)+'월';$('yTitle').textContent=y;
  const f=new Date(y,m,1),start=new Date(f);start.setDate(start.getDate()-f.getDay());
  let h='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=ymd(d),its=ordItems(k),dls=deadlinesOn(k),memo=(store.memos[k]||'').trim();
    const cl=['cell'];
    if(d.getMonth()!==m)cl.push('dim');
    if(d.getDay()===0)cl.push('sun');
    if(d.getDay()===6)cl.push('sat');
    const hol=holOf(k);
    if(hol)cl.push('hol');
    if(k===TODAY)cl.push('today');
    if(k===sel)cl.push('sel');
    if(dls.length)cl.push('hasdl');else if(its.length||memo)cl.push('has');
    const evs=[...dls.map(x=>({t:x.stage,dl:true})),
      ...its.map(i=>({t:i.title,c:catOf(i.cat).color,done:i.done,pri:i.pri}))];
    const MAX=3;
    let ev=evs.slice(0,MAX).map((e,n)=>
      `<span class="ev${e.dl?' dl':''}${e.done?' done':''}${e.pri?' pri':''}" style="--c:${e.c||'var(--red)'}">`+
      `<b class="evn">${n+1}</b><span class="evt">${esc(e.t)}</span></span>`).join('');
    if(evs.length>MAX)ev+=`<span class="ev more"><span class="evt">+${evs.length-MAX}건 더</span></span>`;
    h+=`<button class="${cl.join(' ')}" data-d="${k}">${memo?'<i class="memoflag"></i>':''}`+
       `<span class="num">${d.getDate()}</span>${hol?`<span class="holname">${esc(hol)}</span>`:''}`+
       `<span class="evs">${ev}</span></button>`;
  }
  $('grid').innerHTML=h;
}
function miniMonth(y,m,mark){
  const f=new Date(y,m,1),start=new Date(f);start.setDate(start.getDate()-f.getDay());
  let g='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(d.getMonth()!==m){g+='<span class="yd o">·</span>';continue;}
    const k=ymd(d),cl=['yd'],mk=mark?mark(k):null;
    if(d.getDay()===6)cl.push('sat');
    if(isRed(k,d.getDay()))cl.push('hol');
    if(mk)cl.push(mk);else if(k===TODAY)cl.push('tod');else if(!mark&&hasAny(k))cl.push('hit');
    g+=`<span class="${cl.join(' ')}" data-d="${k}">${d.getDate()}</span>`;
  }
  const cur=(y===today.getFullYear()&&m===today.getMonth());
  return `<div class="ymon${cur?' cur':''}" data-m="${m}"><h4>${m+1}월</h4>
    <div class="ywd"><i>일</i><i>월</i><i>화</i><i>수</i><i>목</i><i>금</i><i>토</i></div>
    <div class="ygrid">${g}</div></div>`;
}

function renderBanner(){
  const k=addDays(TODAY,1),its=ordItems(k).filter(i=>!i.done),dls=deadlinesOn(k),n=its.length+dls.length;
  if(!n){$('banner').innerHTML='';return;}

    ...its.map(i=>(i.pri?'★ ':'')+(i.time?i.time+' ':'')+i.title)].join(' · ');

    <span class="txt">${esc(line)}</span>

function tomorrowRows(){
  const k=addDays(TODAY,1);
  return[...deadlinesOn(k).map(x=>`${x.label} · ${x.stage} 기한`),
    ...ordItems(k).filter(i=>!i.done).map(i=>(i.pri?'★ ':'')+(i.time?i.time+' ':'')+i.title)];

function fire(title,body){
  try{if(navigator.vibrate)navigator.vibrate([220,110,220]);}catch(e){}
  try{new Notification(title,{body,vibrate:[220,110,220],tag:'sched-daily',renotify:true,
    icon:'icons/icon-192.png'});}catch(e){
    try{new Notification(title,{body});}catch(_){}}
}
function notify(){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  const h=store.settings.alertH??20;
  if(new Date().getHours()<h)return;
  const rows=tomorrowRows();
  if(!rows.length||store.notified[TODAY])return;
  store.notified={[TODAY]:true};save(false);
  fire(`내일 ${rows.length}건`,rows.slice(0,4).join('\n'));
}

/* ── 분석 ── */
function parseQuery(raw){
  let s=' '+raw.trim()+' ';
  const ym=s.match(/(\d{4})\s*년/);const year=ym?+ym[1]:null;if(ym)s=s.replace(ym[0],' ');
  const mm=s.match(/(\d{1,2})\s*월/);const month=mm?+mm[1]:null;if(mm)s=s.replace(mm[0],' ');
  let mode=null;
  if(/실적|기록|완료|이력/.test(s)){mode='record';s=s.replace(/실적|기록|완료|이력/g,' ');}
  if(/사이클|흐름|예정|진행|프로세스/.test(s)){mode=mode||'cycle';s=s.replace(/사이클|흐름|예정|진행|프로세스|업무/g,' ');}
  s=s.replace(/업무|분석/g,' ');
  const kw=s.replace(/\s+/g,' ').trim();
  return{kw,year,month,mode:mode||(year&&!month?'record':'cycle')};
}
const matchItem=(i,kw)=>!kw||i.title.toLowerCase().includes(kw.toLowerCase())||(i.note||'').toLowerCase().includes(kw.toLowerCase());
const matchCase=(c,kw)=>!kw||c.label.toLowerCase().includes(kw.toLowerCase());

function cyclePlan(c){
  const st=store.stages;let base=null,rows=[];
  st.forEach((s,i)=>{
    const actual=c.done[s.id]||null;
    let date;
    if(actual)date=actual;
    else if(i===0)date=base=c.start||TODAY;
    else date=addDays(base,s.days);
    base=date;
    rows.push({name:s.name,date,actual:!!actual,limit:s.days,idx:i});
  });
  return rows;
}
function renderGantt(rows,title){
  if(!rows.length)return '';
  const first=rows[0].date,last=rows[rows.length-1].date;
  let lo=first,hi=last;
  if(TODAY<lo)lo=TODAY;if(TODAY>hi)hi=TODAY;
  const span=Math.max(1,diffDays(hi,lo));
  const pos=d=>diffDays(d,lo)/span*100;
  let h=`<div class="card" style="margin-top:12px"><div class="gantt">`;
  rows.forEach((r,i)=>{
    const s=i===0?r.date:rows[i-1].date;
    const left=pos(s),right=pos(r.date);
    const w=Math.max(4,right-left);
    const cls=r.actual?'done':(!r.actual&&r.date<TODAY?'over':'plan');
    h+=`<div class="grow"><div class="glab">${esc(r.name)}</div>
      <div class="gtrack"><div class="gbar ${cls}" style="left:${left}%;width:${w}%">${md(r.date)}</div>
      <div class="gnow" style="left:${pos(TODAY)}%"></div></div></div>`;
  });
  h+=`<div class="gaxis"><span></span><div class="ax"><span>${md(lo)}</span><span>${md(hi)}</span></div></div>`;
  h+=`</div><div class="legend"><span><i style="background:var(--moss)"></i>완료</span>
    <span><i style="background:color-mix(in srgb,var(--indigo) 65%,transparent)"></i>예정</span>
    <span><i style="background:var(--red)"></i>지연</span>
    <span><i style="background:var(--red);width:2px;border-radius:0"></i>오늘</span></div></div>`;
  return h;
}
function runQuery(raw){
  const q=parseQuery(raw);lastQ=q;
  const year=q.year||today.getFullYear();
  const items=store.items.filter(i=>matchItem(i,q.kw)&&i.date.slice(0,4)==String(year)
    &&(!q.month||+i.date.slice(5,7)===q.month));
  const cs=store.cases.filter(c=>matchCase(c,q.kw));
  const scope=q.month?`${year}년 ${q.month}월`:`${year}년`;
  let h=`<div class="card qsum"><div class="k">${esc(q.kw||'전체')}</div>
    <div class="s">${scope} · ${q.mode==='record'?'실적':'업무 사이클'} · 일정 ${items.length}건 · 건 ${cs.length}개</div></div>
    <div class="seg"><button data-m="cal" class="${anMode==='cal'?'on':''}">달력으로 보기</button>
    <button data-m="bar" class="${anMode==='bar'?'on':''}">차트로 보기</button></div>`;

  if(anMode==='bar'){
    if(q.mode==='cycle'&&cs.length){
      cs.forEach(c=>{h+=`<div class="sec">${esc(c.label)}</div>`+renderGantt(cyclePlan(c));});
    }else{
      const cnt=Array.from({length:12},()=>({t:0,d:0}));
      items.forEach(i=>{const m=+i.date.slice(5,7)-1;cnt[m].t++;if(i.done)cnt[m].d++;});
      const max=Math.max(1,...cnt.map(c=>c.t));
      h+=`<div class="card" style="margin-top:12px"><div class="bars">`;
      cnt.forEach((c,m)=>{if(q.month&&m+1!==q.month)return;
        h+=`<div class="brow"><div class="blab">${m+1}월</div>
          <div class="btrack"><div class="bfill d" style="width:${c.d/max*100}%"></div>
          <div class="bfill" style="width:${(c.t-c.d)/max*100}%"></div></div>
          <div class="bval">${c.t||''}</div></div>`;});
      h+=`</div><div class="legend"><span><i style="background:var(--moss)"></i>완료</span>
        <span><i style="background:var(--indigo)"></i>미완료</span></div></div>`;
      if(cs.length)cs.forEach(c=>{h+=`<div class="sec">${esc(c.label)} 단계 흐름</div>`+renderGantt(cyclePlan(c));});
    }
  }else{
    const set={};items.forEach(i=>{set[i.date]=set[i.date]||{t:0,d:0};set[i.date].t++;if(i.done)set[i.date].d++;});
    cs.forEach(c=>{cyclePlan(c).forEach(r=>{if(r.date.slice(0,4)==String(year)){
      set[r.date]=set[r.date]||{t:0,d:0};set[r.date].t++;if(r.actual)set[r.date].d++;}});});
    const mark=k=>set[k]?(set[k].d===set[k].t?'mk2':'mk'):(k===TODAY?'tod':null);
    h+='<div class="year-wrap" style="margin-top:12px">';
    for(let m=0;m<12;m++){if(q.month&&m+1!==q.month)continue;h+=miniMonth(year,m,mark);}
    h+='</div><div class="legend" style="padding:10px 4px 0"><span><i style="background:var(--indigo);border-radius:50%"></i>예정</span><span><i style="background:var(--moss);border-radius:50%"></i>완료</span></div>';
  }

  if(q.mode==='cycle'&&cs.length){
    h+=`<div class="sec">단계 진행 상황</div><div class="card">`;
    cs.forEach(c=>{const s=caseState(c);
      const d=s.complete?'<span class="dcount idle">완료</span>':s.deadline===null?'<span class="dcount idle">시작 전</span>':
        `<span class="dcount ${s.level}">${s.left<0?`${-s.left}일 초과`:s.left===0?'오늘':`D-${s.left}`}</span>`;
      const steps=store.stages.map((t,i)=>{const done=!!c.done[t.id],cur=!done&&i===s.idx;
        const cl=['step'];if(done)cl.push('done');if(cur){cl.push('cur');if(s.level&&s.level!=='ok')cl.push(s.level);}
        return `<button class="${cl.join(' ')}" data-c="${c.id}" data-s="${t.id}">${done?'✓ ':''}${esc(t.name)}</button>`;}).join('');

    h+='</div>';
  }
  if(!items.length&&!cs.length)h+='<div class="card" style="margin-top:12px"><div class="empty">일치하는 내용이 없습니다. 현장명이 일정 제목이나 건 이름에 들어가 있어야 찾을 수 있습니다.</div></div>';

let DB=null,UID=null,docRef=null,pushT=null,pushing=false,dirty=false;
let SB=null,session=null,chan=null,backend=null;
function setSync(state,txt){const d=$('syncDot');if(!d)return;
  d.className=state;$('syncTxt').textContent=txt;}
function pickMap(a,b,mtA,mtB){const out={},keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  keys.forEach(k=>{const ta=(mtA||{})[k]||0,tb=(mtB||{})[k]||0;
    const src=tb>ta?b:a;if(src&&src[k]!==undefined)out[k]=src[k];});
  return out;}
function maxMap(a,b){const o={...(a||{})};Object.entries(b||{}).forEach(([k,v])=>{if(!o[k]||v>o[k])o[k]=v;});return o;}
function mergeRemote(r){
  if(!r||typeof r!=='object')return false;
  let changed=false;
  const byId={};store.items.forEach(i=>byId[i.id]=i);
  (r.items||[]).forEach(ri=>{const li=byId[ri.id];
    if(!li||(ri.mt||0)>(li.mt||0)){byId[ri.id]=ri;changed=true;}});
  const tomb=maxMap(store.tomb,r.tomb);
  let items=Object.values(byId).filter(i=>!(tomb[i.id]&&tomb[i.id]>(i.mt||0)));
  if(items.length!==store.items.length)changed=true;
  store.items=items;store.tomb=tomb;
  const memoMt=maxMap(store.memoMt,r.memoMt);
  const memos=pickMap(store.memos,r.memos||{},store.memoMt,r.memoMt);
  if(JSON.stringify(memos)!==JSON.stringify(store.memos))changed=true;
  store.memos=memos;store.memoMt=memoMt;
  const cById={};store.cases.forEach(c=>cById[c.id]=c);
  (r.cases||[]).forEach(rc=>{const lc=cById[rc.id];
    if(!lc||((r.casesMt||{})[rc.id]||0)>((store.casesMt||{})[rc.id]||0)){cById[rc.id]=rc;changed=true;}});
  const ctomb=maxMap(store.caseTomb,r.caseTomb);
  store.casesMt=maxMap(store.casesMt,r.casesMt);
  const cases=Object.values(cById).filter(c=>!(ctomb[c.id]&&ctomb[c.id]>(store.casesMt[c.id]||0)));
  if(cases.length!==store.cases.length)changed=true;
  store.cases=cases;store.caseTomb=ctomb;
  if((r.stagesMt||0)>(store.stagesMt||0)&&r.stages&&r.stages.length){
    store.stages=r.stages;store.stagesMt=r.stagesMt;changed=true;}
  if((r.catsMt||0)>(store.catsMt||0)&&r.cats&&r.cats.length){
    store.cats=r.cats;store.catsMt=r.catsMt;changed=true;}
  if((r.settingsMt||0)>(store.settingsMt||0)&&r.settings){
    store.settings=r.settings;store.settingsMt=r.settingsMt;changed=true;}
  return changed;
}
function payload(){return{items:store.items,tomb:store.tomb,memos:store.memos,memoMt:store.memoMt,
  cases:store.cases,casesMt:store.casesMt,caseTomb:store.caseTomb,
  stages:store.stages,stagesMt:store.stagesMt,cats:store.cats,catsMt:store.catsMt,
  settings:store.settings,settingsMt:store.settingsMt,
  at:new Date().toISOString()};}
function schedulePush(){if(!docRef)return;dirty=true;
  clearTimeout(pushT);pushT=setTimeout(doPush,1100);}
async function doPush(){
  if(pushing||!dirty)return;
  if(backend==='sb'){
    if(!SB||!session)return;
    pushing=true;dirty=false;setSync('busy','저장 중…');
    const {error}=await SB.from('app_state')
      .upsert({user_id:session.user.id,data:payload(),updated_at:new Date().toISOString()});
    if(error){setSync('busy','저장 실패 · 재시도');dirty=true;}
    else setSync('on','동기화됨 · '+(session.user.email||''));
    pushing=false;if(dirty)setTimeout(doPush,3000);
    return;
  }
  if(backend==='claude'&&docRef){
    pushing=true;dirty=false;setSync('busy','저장 중…');
    try{await docRef.set(payload());setSync('on','동기화됨');}
    catch(e){setSync('','이 기기에만 저장됨');dirty=true;}
    pushing=false;if(dirty)schedulePush();
  }
}
function redrawAll(){renderMonth();renderDay();renderBanner();
  if($('anSheet').classList.contains('open')){$('q').value.trim()?runQuery($('q').value):renderAnHome();}}

/* ── Supabase 백엔드 ── */
const SBCFG='sb-config';
const sbCfg=()=>{try{return JSON.parse(localStorage.getItem(SBCFG)||'null');}catch(e){return null;}};
function sbInit(){
  const cfg=sbCfg();
  if(!cfg||!cfg.url||!cfg.key)return false;
  if(!window.supabase){setSync('','라이브러리 로드 실패');return false;}
  try{
    SB=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
  }catch(e){setSync('','서버 설정 오류');return false;}
  backend='sb';
  SB.auth.onAuthStateChange((_e,sess)=>{session=sess;onAuth();});
  SB.auth.getSession().then(({data})=>{session=data.session;onAuth();});
  return true;
}
async function onAuth(){
  renderAuth();
  if(!session){setSync('','로그인하면 기기끼리 연동됩니다');return;}
  setSync('busy','불러오는 중…');
  const {data,error}=await SB.from('app_state').select('data')
    .eq('user_id',session.user.id).maybeSingle();
  if(error){setSync('busy','불러오기 실패');}
  else{
    if(data&&data.data&&mergeRemote(data.data)){save(false);redrawAll();}
    setSync('on','동기화됨 · '+(session.user.email||''));
    dirty=true;doPush();
  }
  if(chan){try{SB.removeChannel(chan);}catch(e){}}
  chan=SB.channel('state-'+session.user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'app_state',
        filter:'user_id=eq.'+session.user.id},
      pl=>{const d=pl.new&&pl.new.data;
        if(d&&mergeRemote(d)){save(false);redrawAll();}})
    .subscribe();
}
function renderAuth(){
  const cfg=sbCfg(),box=$('authBody');if(!box)return;
  if(!cfg||!cfg.url||!cfg.key){
    box.innerHTML=`<div class="hint-txt">먼저 Supabase 프로젝트를 연결하세요. 대시보드의
      <b>Settings → API</b> 에서 Project URL 과 anon public 키를 복사해 붙여넣으면 됩니다.</div>
      <div class="frow"><input id="sbUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>
      <div class="frow"><input id="sbKey" placeholder="anon public key" autocomplete="off"></div>
      <div class="frow"><button class="go2" id="sbSave">연결</button></div>`;
    $('sbSave').onclick=()=>{
      const u=$('sbUrl').value.trim().replace(/\/$/,''),k=$('sbKey').value.trim();
      if(!/^https:\/\/.+/.test(u)||k.length<20){alert('주소와 키를 다시 확인해 주세요.');return;}
      localStorage.setItem(SBCFG,JSON.stringify({url:u,key:k}));
      location.reload();};
    return;
  }
  if(!session){
    box.innerHTML=`<div class="hint-txt">같은 계정으로 로그인한 기기끼리 일정이 연동됩니다.</div>
      <div class="frow"><input id="aEmail" type="email" placeholder="이메일" autocomplete="username"></div>
      <div class="frow"><input id="aPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password"></div>
      <div class="frow" style="gap:8px"><button class="go2" id="aIn">로그인</button>
        <button class="go2 sec" id="aUp">가입</button></div>
      <div class="hint-txt" id="aMsg"></div>
      <div class="frow"><button class="lnk" id="sbReset">서버 연결 정보 지우기</button></div>`;
    const msg=t=>$('aMsg').textContent=t;
    const creds=()=>({email:$('aEmail').value.trim(),password:$('aPw').value});
    $('aIn').onclick=async()=>{msg('로그인 중…');
      const {error}=await SB.auth.signInWithPassword(creds());
      msg(error?'로그인 실패: '+error.message:'');};
    $('aUp').onclick=async()=>{msg('가입 중…');
      const {error}=await SB.auth.signUp(creds());
      msg(error?'가입 실패: '+error.message:'가입되었습니다. 이메일 확인이 필요하면 메일함을 보세요.');};
    $('aPw').onkeydown=e=>{if(e.key==='Enter')$('aIn').click();};
    $('sbReset').onclick=()=>{localStorage.removeItem(SBCFG);location.reload();};
    return;
  }
  box.innerHTML=`<div class="hint-txt"><b>${esc(session.user.email||'로그인됨')}</b> 으로 연결되어 있습니다.
    다른 기기에서도 같은 계정으로 로그인하면 자동으로 맞춰집니다.</div>
    <div class="frow"><button class="go2 sec" id="aOut">로그아웃</button></div>
    <div class="frow"><button class="lnk" id="sbReset">서버 연결 정보 지우기</button></div>`;
  $('aOut').onclick=async()=>{await SB.auth.signOut();session=null;backend='sb';setSync('','로그아웃됨');renderAuth();};
  $('sbReset').onclick=()=>{localStorage.removeItem(SBCFG);location.reload();};
}
(async()=>{
  setSync('','연결 확인 중…');
  renderAuth();
  if(sbInit())return;
  try{
    const u=await claude.use('user');DB=await claude.use('db');
    if(!DB||!u){setSync('','이 기기에만 저장됨');return;}
    UID=await u.id();
    if(!UID){setSync('','이 기기에만 저장됨');return;}
    backend='claude';
    docRef=DB.doc(`data/users/${UID}/state`);
    const snap=await docRef.get();
    if(snap.exists){if(mergeRemote(snap.data())){save(false);redrawAll();}}
    setSync('on','동기화됨');
    if(!snap.exists)schedulePush();
    docRef.onSnapshot(s2=>{
      if(!s2.exists||s2.metadata.hasPendingWrites)return;
      if(mergeRemote(s2.data())){save(false);redrawAll();}
    },()=>setSync('busy','연결 불안정'));
  }catch(e){setSync('','이 기기에만 저장됨');}
})();

/* ── 설정 ── */
function openSet(){
  let h='';for(let i=6;i<=23;i++)h+=`<option value="${i}"${i===(store.settings.alertH??20)?' selected':''}>${i}시</option>`;
  $('alertH').innerHTML=h;
  const perm=('Notification'in window)?Notification.permission:'unsupported';
  $('permBtn2').textContent=perm==='granted'?'허용됨':perm==='denied'?'차단됨':perm==='unsupported'?'지원 안 함':'허용하기';
  $('permBtn2').disabled=perm!=='default';
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  $('setNote').innerHTML=ios&&!standalone
    ?'아이폰에서는 <b>공유 → 홈 화면에 추가</b>로 설치한 뒤 열어야 알림이 동작합니다.'
    :'앱을 최근에 연 상태에서 설정한 시각이 지나면 알림이 울립니다. 며칠 열지 않으면 알림이 가지 않습니다.';
  $('setPop').classList.add('open');$('popBack').classList.add('open');
}
function paintCatBtn(){const c=catOf(curCat);
  $('catBtn').style.setProperty('--c',c.color);$('catName').textContent=c.name;}
let catTarget=null;
function openCatMenu(itemId,anchorUp){
  catTarget=itemId||null;
  const cur=itemId?(store.items.find(i=>i.id===itemId)||{}).cat:curCat;
  $('catMenu').innerHTML=store.cats.map(c=>
    `<button data-c="${c.id}"${c.id===cur?' class="on"':''}><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')
    +'<button data-c="__edit" style="color:var(--indigo);font-size:13.5px">분류 설정…</button>';
  $('catPop').classList.toggle('up',anchorUp!==false);
  $('catPop').classList.add('open');$('popBack').classList.add('open');
}
$('catBtn').onclick=()=>openCatMenu(null,true);
$('catMenu').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;
  const v=b.dataset.c;closeFind();
  if(v==='__edit'){renderCats();$('catSheet').classList.add('open');return;}
  if(catTarget){const it=store.items.find(i=>i.id===catTarget);
    if(it){it.cat=v;touch(it);save();renderDay();renderMonth();}}
  else{curCat=v;localStorage.setItem('cur-cat',v);paintCatBtn();}
};
function renderCats(){
  $('catList').innerHTML=store.cats.map((c,i)=>`<div class="crow">
    <input type="color" value="${c.color}" data-i="${i}" data-f="color">
    <input type="text" value="${esc(c.name)}" data-i="${i}" data-f="name">
    <button class="mv" data-cdel="${i}">×</button></div>`).join('');
}
$('catList').oninput=e=>{const t=e.target;if(t.dataset.i===undefined)return;
  const c=store.cats[+t.dataset.i];
  if(t.dataset.f==='name')c.name=t.value;else c.color=t.value;
  store.catsMt=NOW();save();paintCatBtn();};
$('catList').onclick=e=>{const d=e.target.closest('[data-cdel]');if(!d)return;
  if(store.cats.length<=2)return;
  const i=+d.dataset.cdel,gone=store.cats[i].id;
  store.cats.splice(i,1);store.catsMt=NOW();
  const fb=store.cats[0].id;
  store.items.forEach(it=>{if(it.cat===gone){it.cat=fb;touch(it);}});
  if(curCat===gone){curCat=fb;localStorage.setItem('cur-cat',fb);}
  save();renderCats();paintCatBtn();renderDay();renderMonth();};
$('addCat').onclick=()=>{store.cats.push({id:'c'+Date.now().toString(36),name:'새 분류',color:'#8a8f9e'});
  store.catsMt=NOW();save();renderCats();};
$('catSetBtn').onclick=()=>{closeFind();renderCats();$('catSheet').classList.add('open');};
$('expBtn').onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`schedule-backup-${TODAY}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){alert('저장할 수 없습니다: '+e.message);}
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.items))throw new Error('형식이 맞지 않습니다');
      mergeRemote(d);save();redrawAll();paintCatBtn();
      alert('불러왔습니다. 기존 일정은 지워지지 않고 합쳐집니다.');
    }catch(err){alert('불러오지 못했습니다: '+err.message);}
    e.target.value='';
  };
  r.readAsText(f);
};
$('setBtn').onclick=openSet;
$('acctBtn').onclick=()=>{closeFind();renderAuth();$('authSheet').classList.add('open');};
$('alertH').onchange=()=>{store.settings.alertH=+$('alertH').value;store.settingsMt=NOW();save();};
$('permBtn2').onclick=()=>{if(!('Notification'in window))return;
  Notification.requestPermission().then(()=>{openSet();notify();renderBanner();});};
$('testBtn').onclick=()=>{
  if(!('Notification'in window)||Notification.permission!=='granted'){
    if(navigator.vibrate)navigator.vibrate([220,110,220]);
    alert('알림 권한을 먼저 허용해 주세요.');return;}
  const rows=tomorrowRows();
  fire(rows.length?`내일 ${rows.length}건`:'알림 테스트',rows.length?rows.slice(0,4).join('\n'):'이 화면이 보이면 정상입니다.');};

/* ── 날짜 미리보기 ── */
const ctip=$('ctip');let tipT=null;
function tipHTML(k){
  const dls=deadlinesOn(k),its=ordItems(k),memo=(store.memos[k]||'').trim(),hol=holOf(k);
  if(!dls.length&&!its.length&&!memo&&!hol)return '';
  const d=fromYmd(k);
  const rows=[...dls.map(x=>`<div class="r dl">${esc(x.stage)} · ${esc(x.label)}</div>`)];
  its.slice(0,4).forEach(i=>rows.push(`<div class="r${i.done?' dn':''}">${
    i.done?'✓ ':(i.pri?'★ ':'')}${i.time?i.time+' ':''}${esc(i.title)}</div>`));
  if(its.length>4)rows.push(`<div class="r mo">외 ${its.length-4}건</div>`);
  if(memo)rows.push(`<div class="r mo">✎ ${esc(memo.split('\n')[0])}</div>`);
  if(hol)rows.unshift(`<div class="r dl">${esc(hol)}</div>`);
  return `<b>${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</b>`+rows.join('');
}
function hideTip(){ctip.classList.remove('on');clearTimeout(tipT);}
function showTip(cell,auto){
  if(!cell)return;
  const html=tipHTML(cell.dataset.d);
  if(!html){hideTip();return;}
  ctip.innerHTML=html;ctip.style.left='0px';ctip.style.top='0px';ctip.classList.add('on');
  const r=cell.getBoundingClientRect(),t=ctip.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2;
  x=Math.max(8,Math.min(x,innerWidth-t.width-8));
  let y=r.top-t.height-8;
  if(y<8)y=r.bottom+8;
  ctip.style.left=x+'px';ctip.style.top=y+'px';
  clearTimeout(tipT);
  if(auto)tipT=setTimeout(hideTip,3800);
}
const CAN_HOVER=matchMedia('(hover:hover) and (pointer:fine)').matches;
if(CAN_HOVER){
  $('grid').addEventListener('mouseover',e=>{const c=e.target.closest('.cell');if(c)showTip(c,false);});
  $('grid').addEventListener('mouseleave',hideTip);
  $('yearWrap').addEventListener('mouseover',e=>{const c=e.target.closest('[data-d]');
    if(c&&!c.classList.contains('o'))showTip(c,false);});
  $('yearWrap').addEventListener('mouseleave',hideTip);
}
addEventListener('scroll',hideTip,{passive:true});
addEventListener('resize',hideTip);

/* ── 방향키 · 트랙패드 ── */
function shiftMonth(n){hideTip();
  if(tab==='year'){yearView+=n;renderYear();}
  else{view.setMonth(view.getMonth()+n);renderMonth();}}
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if([...document.querySelectorAll('.sheet')].some(x=>x.classList.contains('open')))return;
  if($('findPop').classList.contains('open')||$('setPop').classList.contains('open')
    ||$('yrPop').classList.contains('open')||$('catPop').classList.contains('open'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();shiftMonth(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();shiftMonth(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();shiftMonth(-12);}
  else if(e.key==='ArrowDown'){e.preventDefault();shiftMonth(12);}
});
let wAcc=0,wLock=0,wIdle=null;
function onWheel(e){
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*1.2)return;
  e.preventDefault();
  const t=Date.now();
  if(t<wLock)return;
  wAcc+=e.deltaX;
  clearTimeout(wIdle);wIdle=setTimeout(()=>wAcc=0,220);
  if(Math.abs(wAcc)>72){const n=wAcc>0?1:-1;wAcc=0;wLock=t+430;shiftMonth(n);}
}
$('v-cal').addEventListener('wheel',onWheel,{passive:false});
$('v-year').addEventListener('wheel',onWheel,{passive:false});

if('serviceWorker'in navigator)addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});});

paintCatBtn();
renderMonth();renderDay();renderBanner();notify();
setInterval(notify,60000);
</script>
